apiVersion: apps/v1
kind: Deployment
metadata:
  name: labtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: labtrack
  template:
    metadata:
      labels:
        app: labtrack
    spec:
      containers:
        - name: labtrack
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
