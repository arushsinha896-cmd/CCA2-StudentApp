<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto;
               max-width: 800px; padding: 20px; background: #f4f7fb; }
        h1 { color: #244575; }
        .card { background: white; padding: 24px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: #e8eef8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Management System</h1>
        <p>Welcome! View the registered students below.</p>
        <table>
            <tr><th>ID</th><th>Name</th><th>Course</th></tr>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.course }}</td>
            </tr>
            {% endfor %}
        </table>
        <p>Total students: {{ students|length }}</p>
    </div>
</body>
</html>
